<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Braille Decryption Game</title>
  <style>
    body {
  margin: 0;
  background: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcHM3eTAydnI3dDN1eTZlbGxyYnV3eGJzb2M2aW8zamIzM2hlYWZ2MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QpVUMRUJGokfqXyfa1/giphy.gif') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* Optional: dark overlay on background */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  pointer-events: none;
  z-index: 0;
}

.game-container {
  text-align: center;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Target Symbol Box */
.target-box {
  background: #000;
  border: 2px solid #fff;
  width: 60px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2rem;
  color: #fff;
  margin-bottom: 10px;
}

.streak-display {
  margin: 10px;
  font-size: 1.2rem;
  color: #00ff88;
}

/* Braille Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(10, 60px); /* increased cell width */
  gap: 6px;
  background: #111;
  padding: 12px;
  border: 2px solid #222;
}

/* Each Cell */
.cell {
  width: 60px;
  height: 60px;
  background: #000;
  border: 1px solid #333;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2.5rem; /* larger Braille symbols */
  color: #fff;
  font-family: monospace;
  cursor: pointer;
}

.cell:hover {
  background: #e50914;
}

/* Timer Bar */
.timer-bar {
  width: 100%;
  height: 6px;
  background: #222;
  margin-top: 10px;
  position: relative;
}

.timer-fill {
  height: 100%;
  background: #e50914;
  transition: width 0.1s linear;
}

.encrypted-box {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #0e0e0e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.encrypted-icon {
  width: 50px;
  height: 50px;
  margin-bottom: 10px;
  filter: invert(1); /* makes black icon white if needed */
}

.encrypted-text {
  font-size: 1rem;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
}

/* Game Over */
#gameOverScreen {
  margin-top: 20px;
  color: #fff;
}

#gameOverScreen button {
  padding: 10px 20px;
  background: #e50914;
  color: #fff;
  border: none;
  font-size: 1rem;
  cursor: pointer;
}
  </style>
</head>
<body>
  <div class="game-container">

    <!-- Target Symbol -->
    <div class="target-box" id="targetSymbol">?</div>

    <!-- Streak Display -->
    <div class="streak-display" id="streakDisplay">Streak: 0</div>

    <!-- Braille Grid -->
    <div class="grid" id="grid"></div>

    <!-- Timer Bar -->
    <div class="timer-bar">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <!-- Encrypted Message Overlay -->
    <div id="encryptedBox" class="encrypted-box" style="display: none;">
      <img src="lock-icon.svg" alt="Encrypted" class="encrypted-icon" />
      <div class="encrypted-text">Files encrypted, user bypass required..</div>
    </div>

    <!-- Game Over -->
    <div id="gameOverScreen" style="display: none;">
      <h2>GAME OVER</h2>
      <button id="playAgainBtn">Play Again</button>
    </div>

  </div>
  <script>
    const grid = document.getElementById('grid');
const targetDisplay = document.getElementById('targetSymbol');
const timerFill = document.getElementById('timerFill');
const streakDisplay = document.getElementById('streakDisplay');
const gameOverScreen = document.getElementById('gameOverScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const encryptedBox = document.getElementById('encryptedBox');

const brailleSymbols = [];
for (let i = 0x2800; i <= 0x28FF; i++) {
    brailleSymbols.push(String.fromCharCode(i));
}

let realIndex, targetSymbol, timer, timeLeft;
let correctClicks = 0;
const totalRequired = 3;
let roundCounter = 0;
let streak = 0;
let gameActive = true;

startGame();

function startGame() {
    gameActive = true;
    roundCounter++;
    grid.innerHTML = "";
    correctClicks = 0;
    timeLeft = 10;

    encryptedBox.style.display = 'none';

    targetSymbol = brailleSymbols[Math.floor(Math.random() * brailleSymbols.length)];
    targetDisplay.textContent = targetSymbol;
    targetDisplay.classList.remove('encrypted-text');

    generateGrid();
    startTimer();
    startRandomShuffle();
}

function generateGrid() {
    const totalCells = 100; // 10x10 grid
    realIndex = Math.floor(Math.random() * totalCells);

    for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        const symbolSpan = document.createElement('span');
        symbolSpan.classList.add('symbol');
        symbolSpan.textContent = brailleSymbols[Math.floor(Math.random() * brailleSymbols.length)];

        cell.appendChild(symbolSpan);

        if (i === realIndex) {
            symbolSpan.textContent = targetSymbol;
            cell.dataset.real = "true";
        }

        cell.dataset.round = roundCounter;
        grid.appendChild(cell);

        cell.addEventListener('click', () => handleClick(cell));
    }
}

function handleClick(cell) {
    if (!gameActive) return;

    const symbolSpan = cell.querySelector('.symbol');
    const cellSymbol = symbolSpan.textContent;

    if (cell.dataset.real === "true" && cellSymbol === targetSymbol) {
        correctClicks++;
        timeLeft = 10;

        if (correctClicks >= totalRequired) {
            clearInterval(timer);
            streak++;

            // Show encrypted overlay instead of target display
            encryptedBox.style.display = 'block';

            setTimeout(() => {
                streakDisplay.textContent = `Streak: ${streak}`;
                startGame();
            }, 2000);
        } else {
            cell.removeAttribute('data-real');
            symbolSpan.textContent = brailleSymbols[Math.floor(Math.random() * brailleSymbols.length)];
            placeTargetSymbol();
        }
    } else {
        cell.style.background = "#e50914";
        setTimeout(() => {
            cell.style.background = "#000";
        }, 500);
    }
}

function placeTargetSymbol() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => delete cell.dataset.real);

    let newIndex;
    do {
        newIndex = Math.floor(Math.random() * cells.length);
    } while (cells[newIndex].dataset.real === "true");

    realIndex = newIndex;
    const targetCell = cells[realIndex];
    const symbolSpan = targetCell.querySelector('.symbol');

    symbolSpan.textContent = targetSymbol;
    symbolSpan.style.opacity = '1';
    targetCell.dataset.real = "true";
    targetCell.dataset.round = roundCounter;
}

function startRandomShuffle() {
    const cells = document.querySelectorAll('.cell');

    cells.forEach(cell => {
        const symbolSpan = cell.querySelector('.symbol');

        function shuffleLoop() {
            if (!gameActive || parseInt(cell.dataset.round) !== roundCounter) return;

            if (cell.dataset.real === "true") {
                if (symbolSpan.textContent !== targetSymbol) {
                    symbolSpan.textContent = targetSymbol;
                }
                symbolSpan.style.opacity = '1';
                setTimeout(shuffleLoop, 1000);
                return;
            }

            symbolSpan.style.transition = 'opacity 0.4s ease';
            symbolSpan.style.opacity = '0';

            setTimeout(() => {
                if (!gameActive || parseInt(cell.dataset.round) !== roundCounter || cell.dataset.real === "true") return;

                symbolSpan.textContent = brailleSymbols[Math.floor(Math.random() * brailleSymbols.length)];
                symbolSpan.style.opacity = '1';

                const nextDelay = Math.random() * 2000 + 1000;
                setTimeout(shuffleLoop, nextDelay);
            }, 400);
        }

        shuffleLoop();
    });
}

function startTimer() {
    clearInterval(timer);
    timeLeft = 10;

    timer = setInterval(() => {
        if (!gameActive) return;

        timeLeft -= 0.1;
        timerFill.style.width = `${(timeLeft / 10) * 100}%`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            showGameOver();
        }
    }, 100);
}

function showGameOver() {
    gameActive = false;
    gameOverScreen.style.display = 'block';
}

playAgainBtn.addEventListener('click', () => {
    gameOverScreen.style.display = 'none';
    streak = 0;
    streakDisplay.textContent = `Streak: ${streak}`;
    startGame();
});

  </script>
</body>
</html>
